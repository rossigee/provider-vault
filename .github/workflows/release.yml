# Custom Release Workflow for provider-vault
# Publishes to ghcr.io/rossigee using the crossplane build system.
name: Release (Official Workflows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ github.token }}

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build Artifacts
        run: |
          set -e
          export VERSION="${{ steps.version.outputs.version }}"
          export BRANCH_NAME="master"
          make build.all build.artifacts

      - name: Upload XPKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpkg
          path: _output/xpkg/linux_amd64/provider-vault-${{ steps.version.outputs.version }}.xpkg

  publish:
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ github.token }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'

      - name: Vendor Dependencies
        run: go mod vendor

      - name: Install Build Tools
        run: make build.init

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Detected version: $VERSION"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Publish Artifacts
        env:
          BRANCH_NAME: master
        run: |
          set -e
          echo "Building version ${{ steps.version.outputs.version }}"
          
          retry_count=0
          max_retries=3
          while [ $retry_count -lt $max_retries ]; do
            if make publish.artifacts \
              REGISTRY_ORGS="ghcr.io/${{ github.repository_owner }}" \
              XPKG_REG_ORGS="ghcr.io/${{ github.repository_owner }}" \
              BRANCH_NAME=master; then
              echo "Publish succeeded"
              break
            else
              retry_count=$((retry_count + 1))
              echo "Publish attempt $retry_count failed, waiting 10s before retry..."
              if [ $retry_count -lt $max_retries ]; then
                sleep 10
              fi
            fi
          done
          
          if [ $retry_count -eq $max_retries ]; then
            echo "⚠️ Publish failed after $max_retries attempts - GHCR push may require manual intervention"
            echo "Release and GitHub release were created successfully"
          fi

      - name: Verify Publication
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"
          REGISTRY_PATH="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          if docker pull "${REGISTRY_PATH}:${VERSION}" > /dev/null 2>&1; then
            DIGEST=$(docker inspect "${REGISTRY_PATH}:${VERSION}" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
            echo "✅ Verified container image ${VERSION} (${DIGEST})"
          else
            echo "⚠️ Container image not found - GHCR push may have failed"
            echo "This is a known issue since late July 2026"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ github.event.repository.name }} ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true

  verify-publication:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Publication
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          PROVIDER_NAME="${{ github.event.repository.name }}"
          REGISTRY_PATH="ghcr.io/rossigee/${PROVIDER_NAME}"

          echo "Verifying publication to ${REGISTRY_PATH}:${VERSION}"
          if docker pull "${REGISTRY_PATH}:${VERSION}" > /dev/null 2>&1; then
            DIGEST=$(docker inspect "${REGISTRY_PATH}:${VERSION}" --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
            echo "✅ Verified container image ${VERSION}"
            echo "   Digest: ${DIGEST}"
          else
            echo "⚠️ Container image not available - GHCR push issue"
            echo "GitHub Release was created successfully at https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
          fi