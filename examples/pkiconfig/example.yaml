apiVersion: pkiconfig.vault.m.crossplane.io/v1beta1
kind: PKIConfig
metadata:
  name: pki-production-ecdsa
  namespace: vault
spec:
  forProvider:
    backend: pki-production-ecdsa
    type: root_internal
    commonName: Example Production ECDSA Root CA
    ttl: 87600h
    keyType: ec
    keyBits: 384
    organization:
      - Example
    permittedDnsDomains:
      - example.lan
      - svc.cluster.local
    issuingCertificates:
      - https://vault.example.lan/v1/pki-production-ecdsa/ca
    crlDistributionPoints:
      - https://vault.example.lan/v1/pki-production-ecdsa/crl
  providerConfigRef:
    name: default
